name: Frontend CI

on:
  push:
    branches: ["main", "project-docs-and-ci", "audit-current-npm-dependencies"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency vulnerabilities (diagnostic only)
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('VULNERABILITY SUMMARY');
          console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          console.log('DETAILS');
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: v.severity,
              direct: v.isDirect,
              range: v.range,
              fixAvailable: v.fixAvailable,
              via: (v.via ?? []).map(x => typeof x === 'string' ? x : ({
                name: x.name, title: x.title, range: x.range, url: x.url
              }))
            }));
          }
          NODE
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
